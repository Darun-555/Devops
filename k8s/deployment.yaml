apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-system-app
  namespace: default
  labels:
    app: hospital-system-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hospital-system-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: hospital-system-app
    spec:
      containers:
        - name: hospital-system-app
          image: hospital-system-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: hospital-app-config
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: hospital-app-secret
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hospital-app-secret
                  key: JWT_SECRET
            - name: JWT_EXPIRE
              valueFrom:
                secretKeyRef:
                  name: hospital-app-secret
                  key: JWT_EXPIRE
          # Uses the HEALTHCHECK from your Dockerfile
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"